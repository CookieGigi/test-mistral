name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            webllm-agentic-loop/package-lock.json
            webllm-agent-canvas/package-lock.json

      - name: Build webllm-agentic-loop
        working-directory: webllm-agentic-loop
        run: |
          npm ci
          npm run build

      - name: Build webllm-agent-canvas
        working-directory: webllm-agent-canvas
        run: |
          npm ci
          npm run build

      - name: Assemble site
        run: |
          mkdir -p gh-dist/loop gh-dist/canvas
          cp -r webllm-agentic-loop/dist/* gh-dist/loop/
          cp -r webllm-agent-canvas/dist/* gh-dist/canvas/
          cp pages/index.html gh-dist/index.html
          touch gh-dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: gh-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
